name: cuDAO GPU CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cudao-gpu-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpu-test:
    name: GPU test on self-hosted runner
    runs-on: [self-hosted, linux, x64, cuda]

    env:
      CUDA_ARCH: 86

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.CI_SSH_KEY }}
          ssh-known-hosts: github.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMqyc2PzMR2I5B1wTE3w6FmYw36OhdMGF6DVL+M0tt
          ssh-strict: true
          persist-credentials: false

      - name: Show toolchain
        run: |
          nvidia-smi
          nvcc --version
          cmake --version

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CUDA_ARCHITECTURES=${CUDA_ARCH} \
            -DCUDAO_BUILD_TESTS=ON \
            -DCUDAO_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure